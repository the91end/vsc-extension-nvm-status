name: Publish Extension

# Publishes the extension to the VS Code Marketplace.
#
# Triggers:
#   - Publishing a GitHub Release (recommended flow: tag + release notes).
#   - Manual run from the Actions tab (workflow_dispatch).
#
# Requirements:
#   - Repository secret VSCE_PAT: an Azure DevOps Personal Access Token
#     with the Marketplace > Manage scope, for the publisher in package.json.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Publish to VS Code Marketplace
        run: npx --yes @vscode/vsce publish
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
